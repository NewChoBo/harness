name: Branch Lifecycle Audit

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    name: Audit merged short-lived branches
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const shortLivedPrefixes = [
              'agent/',
              'automation/',
              'chore/',
              'feat/',
              'fix/',
              'refactor/',
              'release/',
              'work/',
              'noop-',
            ];

            const [branches, openPulls] = await Promise.all([
              github.paginate(github.rest.repos.listBranches, {
                owner,
                repo,
                per_page: 100,
              }),
              github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
              }),
            ]);

            const activeHeads = new Set(
              openPulls
                .filter((pull) => pull.head.repo?.full_name === `${owner}/${repo}`)
                .map((pull) => pull.head.ref),
            );
            const comparisonsByHead = new Map();
            const cleanupDebt = [];

            for (const branch of branches) {
              if (branch.name === defaultBranch || branch.protected || activeHeads.has(branch.name)) {
                continue;
              }
              if (!shortLivedPrefixes.some((prefix) => branch.name.startsWith(prefix))) {
                continue;
              }

              let comparison = comparisonsByHead.get(branch.commit.sha);
              if (!comparison) {
                const response = await github.request(
                  'GET /repos/{owner}/{repo}/compare/{basehead}',
                  {
                    owner,
                    repo,
                    basehead: `${defaultBranch}...${branch.commit.sha}`,
                  },
                );
                comparison = response.data;
                comparisonsByHead.set(branch.commit.sha, comparison);
              } else {
                core.info(
                  `Reusing ${defaultBranch}...${branch.commit.sha} comparison for ${branch.name}`,
                );
              }

              if (comparison.ahead_by === 0) {
                cleanupDebt.push({
                  branch: branch.name,
                  head: branch.commit.sha,
                });
              } else {
                core.info(
                  `Keeping ${branch.name}: ${comparison.ahead_by} commit(s) are not in ${defaultBranch}`,
                );
              }
            }

            if (cleanupDebt.length === 0) {
              await core.summary
                .addHeading('Branch lifecycle audit')
                .addRaw('No fully merged short-lived branch cleanup debt was found.')
                .write();
              return;
            }

            await core.summary
              .addHeading('BRANCH_CLEANUP_ADMIN_REQUIRED')
              .addRaw(
                'The following short-lived branches are fully contained in the default branch and have no open PR. Configure the repository to automatically delete merged head branches or remove them through an exact administrator cleanup path. This workflow intentionally does not use the non-atomic read-then-delete REST sequence.',
              )
              .addTable([
                [
                  { data: 'Branch', header: true },
                  { data: 'Observed head', header: true },
                ],
                ...cleanupDebt.map(({ branch, head }) => [branch, head]),
              ])
              .write();

            core.setFailed(
              `BRANCH_CLEANUP_ADMIN_REQUIRED: ${cleanupDebt.map(({ branch }) => branch).join(', ')}`,
            );
