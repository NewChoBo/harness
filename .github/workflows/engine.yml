name: Engine Validate

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - packages/engine/**
      - standard/catalog.yaml
      - .github/workflows/engine.yml
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - packages/engine/**
      - standard/catalog.yaml
      - .github/workflows/engine.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Engine Validate (${{ github.workflow }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run release:check
