name: Engine Validate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/engine/**
      - schemas/**
      - standard/catalog.yaml
      - scripts/validate-workspace-packages.mjs
      - scripts/check-public-boundary.mjs
      - .github/workflows/engine.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Engine Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @newchobo/harness-core validate
      - run: pnpm validate:workspace
      - run: pnpm validate:public
