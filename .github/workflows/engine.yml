name: Engine Validate

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - packages/engine/**
      - standard/catalog.yaml
      - .github/workflows/engine.yml
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - packages/engine/**
      - standard/catalog.yaml
      - .github/workflows/engine.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run validate
