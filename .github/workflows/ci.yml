name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'agent/**'
      - 'automation/**'
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'release/**'
      - 'work/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate-lockfile:
    name: Regenerate candidate lockfile
    if: github.event_name == 'push' && github.ref_name == 'agent/current-structure-recursive-hardening'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit regenerated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml is already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(workspace): regenerate pnpm lockfile'
          git push origin "HEAD:${GITHUB_REF_NAME}"

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:strict
