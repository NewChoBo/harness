name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'agent/**'
      - 'automation/**'
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'release/**'
      - 'work/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:strict
